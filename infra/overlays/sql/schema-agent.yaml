# The schema agent. Shaped like infra/base/orchestrator-scratch.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-agent
  labels:
    app.kubernetes.io/name: schema-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-agent
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema-agent
          image: harness/sql-schema-agent:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: harness-env
            - configMapRef:
                name: domain-env
            - secretRef:
                name: llm-credentials
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: schema-agent
  labels:
    app.kubernetes.io/name: schema-agent
spec:
  selector:
    app.kubernetes.io/name: schema-agent
  ports:
    - name: http
      port: 8000
      targetPort: http
