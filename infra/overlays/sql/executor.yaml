# The sql tool server: the only pod with the database. Shaped like
# infra/base/orchestrator-scratch.yaml, with two differences:
# - no envFrom: it calls no model and is given no configuration or credentials;
# - a writable /tmp, the only writable path in the pod (see below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  labels:
    app.kubernetes.io/name: executor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: executor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: executor
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: executor
          image: harness/sql-executor:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # SQLite spills large sorts and DISTINCTs to a temp file, even on a read-only
        # database; without this they fail with "disk I/O error". In memory, so the
        # size limit makes a runaway query fail with "database or disk is full"
        # instead of getting the pod evicted. Counts against the memory limit.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: executor
  labels:
    app.kubernetes.io/name: executor
spec:
  selector:
    app.kubernetes.io/name: executor
  ports:
    - name: http
      port: 8000
      targetPort: http
