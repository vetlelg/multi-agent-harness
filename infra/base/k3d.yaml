# The local cluster: one k3s node in Docker, shared by every domain (each in its own
# namespace, harness-<domain>).
#
#   k3d cluster create --config infra/base/k3d.yaml      (or: make cluster)
#
# k3d itself is pinned by how it is installed: winget install --id k3d.k3d --version 5.9.0
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  # The kubeconfig context becomes k3d-harness.
  name: harness
servers: 1
agents: 0
# Pinned by digest, like the Python base image. v1.35 keeps Docker Desktop's
# kubectl 1.34 within the supported one-minor skew.
image: rancher/k3s:v1.35.9-k3s1@sha256:ec9868c6a38d4e8c1869832fb5fd1eb8473c39794a0b44d2b952e7ba911951bc
kubeAPI:
  # Loopback only; k3d's default is every interface.
  hostIP: "127.0.0.1"
options:
  k3d:
    # One server and no port mappings: nothing for the load balancer to do.
    disableLoadbalancer: true
  k3s:
    # Nothing is published from the cluster; the way in is kubectl port-forward.
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable=servicelb
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
